name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install pinned dependencies
        run: |
          python -m pip install pip==24.3.1
          python -m pip install --only-binary=:all: -r requirements-lock.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Built-in self-test
        run: python run_aurelia.py --selftest --report selftest-report.txt --data-dir "$RUNNER_TEMP/aurelia-data"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-report-linux
          path: selftest-report.txt
          if-no-files-found: ignore
